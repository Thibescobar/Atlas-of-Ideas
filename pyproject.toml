[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-of-ideas"
version = "0.3.0"
description = "An AI-assisted knowledge graph for exploring connections across domains of human thought."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "networkx>=3.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "streamlit>=1.36",
  "pypdf>=5.0",
  "pyvis>=0.3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
